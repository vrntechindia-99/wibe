version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wibe-postgres
    environment:
      POSTGRES_USER: wibe
      POSTGRES_PASSWORD: wibe_password
      POSTGRES_DB: wibe
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wibe -d wibe"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wibe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: wibe-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  coturn:
    image: instrumentisto/coturn:latest
    container_name: wibe-coturn
    network_mode: host
    environment:
      TURN_USERNAME: wibe
      TURN_PASSWORD: wibe_turn_password
      TURN_REALM: wibe.local
      EXTERNAL_IP: 127.0.0.1
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro

volumes:
  postgres_data:
  redis_data:
  minio_data: