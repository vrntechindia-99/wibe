# TURN Server Configuration for Wibe
listening-port=3478
tls-listening-port=5349
listening-ip=0.0.0.0
relay-ip=0.0.0.0
external-ip=127.0.0.1

realm=wibe.local
user=wibe:wibe_turn_password

lt-cred-mech
no-tls
no-dtls

# Logging
verbose
log-file=stdout

# Security
no-multicast-peers
no-loopback-peers

# Performance
max-bps=1000000
total-quota=10000
user-quota=1000