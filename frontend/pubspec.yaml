name: wibe
description: Wibe - Chat. Connect. Wibe.
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State Management
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^12.1.1

  # Dependency Injection
  get_it: ^7.6.4

  # Local Database
  drift: ^2.12.1
  sqlite3_flutter_libs: ^0.5.19
  path_provider: ^2.1.1
  path: ^1.8.3

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # WebSocket
  socket_io_client: ^2.0.3+1

  # WebRTC
  flutter_webrtc: ^0.10.6

  # Media
  image_picker: ^1.0.4
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  video_player: ^2.8.1
  permission_handler: ^11.0.1

  # Storage
  flutter_secure_storage: ^9.0.0

  # Utilities
  connectivity_plus: ^5.0.2
  intl: ^0.18.1
  uuid: ^4.2.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1

  # UI
  shimmer: ^3.0.0
  flutter_svg: ^2.0.9
  lottie: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0
  build_runner: ^2.4.7
  riverpod_generator: ^2.3.9
  drift_dev: ^2.12.1
  freezed: ^2.4.5
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/